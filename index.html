  text-align:center; font-size:11.5px; color:var(--on-surface-variant);
  margin-top:10px; opacity:.85;
}
 
/* 回到底部悬浮按钮 */
.fab-anchor{
  position:sticky; bottom:14px; height:0;
  display:flex; justify-content:center; pointer-events:none;
}
.scroll-fab{
  pointer-events:auto; width:40px; height:40px; border-radius:50%;
  border:none; background:var(--surface-container-high); color:var(--on-surface-variant);
  box-shadow:var(--shadow-2); display:flex; align-items:center; justify-content:center;
  cursor:pointer; position:relative; overflow:hidden;
  opacity:0; transform:translateY(12px) scale(.85);
  transition:opacity .25s var(--ease), transform .25s var(--ease), background-color .25s;
}
.scroll-fab.show{ opacity:1; transform:none }
.scroll-fab .material-symbols-rounded{ font-size:20px }
 
/* ============ Toast ============ */
.toast{
  position:fixed; left:50%; bottom:30px; z-index:100;
  transform:translate(-50%, 18px);
  background:var(--toast-bg); color:var(--toast-fg);
  padding:11px 20px; border-radius:10px; font-size:13.5px;
  opacity:0; pointer-events:none;
  transition:opacity .22s var(--ease), transform .22s var(--ease);
  box-shadow:var(--shadow-2); max-width:80vw;
}
.toast.show{ opacity:1; transform:translate(-50%, 0) }
 
/* ============ Ripple ============ */
.ripple{
  position:absolute; border-radius:50%; background:currentColor;
  opacity:.14; transform:scale(0); pointer-events:none;
  animation:rippleAnim .55s var(--ease) forwards;
}
@keyframes rippleAnim{ to{ transform:scale(1); opacity:0 } }

  display:flex; gap:10px; align-items:flex-start;
  padding:12px 14px; border-radius:12px;

}
.err-box .material-symbols-rounded{ font-size:20px; flex-shrink:0; margin-top:1px }
.err-act{
  margin-top:8px; border:none; background:transparent; padding:0;
  color:var(--danger); font-size:13px; font-weight:500;
  cursor:pointer; text-decoration:underline;
}
.mm-group{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px 4px }
.mm-group-name{ font-size:11.5px; font-weight:500; color:var(--on-surface-variant); letter-spacing:.4px }
.mm-key-state{ display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--on-surface-variant) }

.mm-key-state.ok{ color:#1e8e3e }

async function readSSE(res, onData){
  const reader = res.body.getReader();
  const dec = new TextDecoder();

  while (true){
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines){
      const t = line.trim();
      if (!t.startsWith('data:')) continue;
      const payload = t.slice(5).trim();
      if (payload === '[DONE]') return;
      try { onData(JSON.parse(payload)); } catch {}
    }
  }
}
 
/* 真实 API 流式调用（DeepSeek / Gemini，均为 SSE） */
async function streamReal(aiMsg, body, model, history, t0, signal){
  const p = PROVIDERS[model.provider];
  const baseUrl = (state.baseUrls[p.id] || p.defaultBaseUrl).replace(/\/+$/, '');
  let res;
  if (p.id === 'google'){
    res = await fetch(baseUrl + '/v1beta/models/' + model.apiModel + ':streamGenerateContent?alt=sse', {
      method: 'POST', signal,
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': state.keys.google },
      body: JSON.stringify({
        contents: history.map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.content }] })),
      }),
    });
  } else {
    res = await fetch(baseUrl + '/chat/completions', {
      method: 'POST', signal,
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.keys.deepseek },
      body: JSON.stringify({
        model: model.apiModel, stream: true, stream_options: { include_usage: true },
        messages: history.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content })),
      }),
    });
  }
  if (!res.ok){
    let msg = 'HTTP ' + res.status;
    try {
      const j = await res.json();
      msg = (j.error && (j.error.message || j.error.msg)) || j.message || msg;
    } catch {}
    if (res.status === 401 || res.status === 403) msg = 'API Key 无效或无权限（' + res.status + '）';
    else if (res.status === 429) msg = '请求过于频繁，已被限流（429）';
    throw new Error(msg);
  }
  let first = true, acc = '';
  await readSSE(res, chunk => {
    if (first){ aiMsg.stats.ttftMs = Math.round(performance.now() - t0); first = false; }
    let piece = '';
    if (p.id === 'google'){
      const cand = chunk.candidates && chunk.candidates[0];
      if (cand && cand.content && cand.content.parts) piece = cand.content.parts.map(x => x.text || '').join('');
      const u = chunk.usageMetadata;
      if (u){
        if (u.promptTokenCount) aiMsg.stats.promptTokens = u.promptTokenCount;
        if (u.candidatesTokenCount) aiMsg.stats.completionTokens = u.candidatesTokenCount;
      }
    } else {
      piece = (chunk.choices && chunk.choices[0] && chunk.choices[0].delta && chunk.choices[0].delta.content) || '';
      if (chunk.usage){
        if (chunk.usage.prompt_tokens) aiMsg.stats.promptTokens = chunk.usage.prompt_tokens;
        if (chunk.usage.completion_tokens) aiMsg.stats.completionTokens = chunk.usage.completion_tokens;
      }
    }
    if (piece){
      acc += piece;
      aiMsg.content = acc;
      if (!aiMsg.stats.completionTokens) aiMsg.stats.completionTokens = estimateTokens(acc);
      body.innerHTML = mdToHtml(acc);
      if (isNearBottom()) scrollToBottom(false);
    }
  });
  if (!acc) throw new Error('接口未返回内容，请检查模型与 Key 是否匹配');
}
